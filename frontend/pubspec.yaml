version: 1.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.4
  http: ^1.2.2
