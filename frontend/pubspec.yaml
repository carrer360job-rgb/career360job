name: vetrijobs
description: "VetriJobs (வெற்றி ஜாப்ஸ்) — Universal Job Recruitment Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  http: ^1.2.2
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  file_picker: ^13.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
